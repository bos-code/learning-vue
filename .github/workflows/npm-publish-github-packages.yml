name: Vue + Bun CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [created]

jobs:
  setup-bun:
    runs-on: ubuntu-latest
    outputs:
      bun-path: ${{ steps.set-path.outputs.bun-path }}
    steps:
      - uses: actions/checkout@v4

      # Install Bun
      - name: Install Bun
        id: set-path
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "BUN_INSTALL=$HOME/.bun" >> $GITHUB_ENV
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          echo "bun-path=$HOME/.bun/bin" >> $GITHUB_OUTPUT

      # Install dependencies once
      - run: bun install

  build-and-test:
    needs: setup-bun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Restore Bun path
      - run: echo "PATH=${{ needs.setup-bun.outputs.bun-path }}:$PATH" >> $GITHUB_ENV

      # Run tests
      - run: bun test

      # Build Vue project
      - run: bun run build

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Restore Bun path
      - run: echo "PATH=${{ needs.setup-bun.outputs.bun-path }}:$PATH" >> $GITHUB_ENV

      # Deploy to Vercel
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./